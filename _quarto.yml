project:
  type: website

website:
  title: "Pachitariu + Stringer lab"
  description: "We study how large populations of neurons in the mammalian cortex learn and represent the world."
  site-url: https://mouseland.github.io
  favicon: images/logo.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  navbar:
    title: false
    left:
      - href: index.qmd
        text: Home
      - href: research/index.qmd
        text: Research
      - href: research/publications.qmd
        text: Publications
      - href: people/index.qmd
        text: People
      - href: code_and_data.qmd
        text: Code & data
      - href: news.qmd
        text: News & talks
    right:
      - href: positions.qmd
        text: Join us

  body-header: |
    <div class="lab-mark"><a href="https://github.com/MouseLand" title="MouseLand on GitHub"><img src="/images/logo.png" alt="MouseLand GitHub organization"></a></div>

  body-footer: |
    <div class="lab-footer">
    <p><strong>Pachitariu + Stringer lab</strong><br>
    Research funded by the <a href="https://www.hhmi.org/">Howard Hughes Medical Institute</a>.</p>
    <p class="footer-fine">Built with <a href="https://www.quarto.org">Quarto</a>. &copy; Marius Pachitariu &amp; Carsen Stringer, 2026.</p>
    </div>

format:
  html:
    theme: [journal, theme.scss]
    toc: true
    css: styles.css
    grid:
      margin-width: 200px
      body-width: 960px

execute:
  freeze: auto
